<div class="task-list">
  @for (item of items; track item.occurrence?.id ?? item.task.id) {
    <app-task-card
      [task]="item.task"
      [occurrence]="item.occurrence"
      [statusLabel]="item.statusLabel ?? 'Pendiente'"
      [contextLabel]="item.contextLabel ?? null"
      [isEditable]="isEditable"
      [showComplete]="showComplete"
      [showFailure]="showFailure"
      [showOccurrenceEdit]="showOccurrenceEdit"
      (edit)="edit.emit($event)"
      (editOccurrence)="editOccurrence.emit($event)"
      (complete)="complete.emit($event)"
      (fail)="fail.emit($event)"
    />
  }
</div>
